name: echo_app
description: Echo - 盲听复说英语训练 App

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.4.9

  # 路由
  go_router: ^13.0.1

  # HTTP 请求
  dio: ^5.4.0
  retrofit: ^4.0.3

  # 本地存储
  shared_preferences: ^2.2.2

  # 微信 SDK
  fluwx: ^4.6.1

  # UI 组件
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  retrofit_generator: ^8.0.6
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
